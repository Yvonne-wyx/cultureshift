name: Research
description: Define a bounded research question and evidence plan
title: "[Research]: "
labels: []
body:
  - type: textarea
    id: goal
    attributes: { label: Goal }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Scope }
    validations: { required: true }
  - type: textarea
    id: non_goals
    attributes: { label: Non-goals }
    validations: { required: true }
  - type: input
    id: owner
    attributes: { label: Owner }
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes: { label: Dependencies }
  - type: textarea
    id: files
    attributes: { label: Files }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria }
    validations: { required: true }
  - type: textarea
    id: verification
    attributes: { label: Verification, description: Explain how sources and uncertainty will be checked. }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: Separate evidence from CulturalHypothesis statements. }
  - type: textarea
    id: risks
    attributes: { label: Risks, description: Include privacy, licensing, bias, and representativeness risks. }
