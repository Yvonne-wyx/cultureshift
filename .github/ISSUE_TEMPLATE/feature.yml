name: Feature
description: Propose a scoped product or engineering feature
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: goal
    attributes: { label: Goal }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Scope }
    validations: { required: true }
  - type: textarea
    id: non_goals
    attributes: { label: Non-goals }
    validations: { required: true }
  - type: input
    id: owner
    attributes: { label: Owner }
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes: { label: Dependencies }
  - type: textarea
    id: files
    attributes: { label: Files }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: Use a checklist. }
    validations: { required: true }
  - type: textarea
    id: verification
    attributes: { label: Verification }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Evidence }
  - type: textarea
    id: risks
    attributes: { label: Risks }
