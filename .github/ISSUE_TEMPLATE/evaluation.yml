name: Evaluation
description: Define a bounded evaluation with honest metrics and evidence
title: "[Evaluation]: "
labels: []
body:
  - type: textarea
    id: goal
    attributes: { label: Goal }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Scope }
    validations: { required: true }
  - type: textarea
    id: non_goals
    attributes: { label: Non-goals }
    validations: { required: true }
  - type: input
    id: owner
    attributes: { label: Owner }
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes: { label: Dependencies }
  - type: textarea
    id: files
    attributes: { label: Files }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria }
    validations: { required: true }
  - type: textarea
    id: verification
    attributes: { label: Verification, description: Define method, baselines, and reproducible checks. }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Evidence, description: Record real results only; do not imply automated cultural validation. }
  - type: textarea
    id: risks
    attributes: { label: Risks }
