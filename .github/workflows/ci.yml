name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CULTURESHIFT_CAPABILITY_SECRET: "ci-fixture-secret-not-for-production"
      CULTURESHIFT_TEMP_ASSET_DIR: ".cultureshift/assets"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest

  contracts-web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -e .
      - run: npm --prefix apps/web ci
      - run: python scripts/export_contracts.py --check
      - run: npm --prefix apps/web run contracts:check
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web audit --audit-level=high
      - run: npm --prefix apps/web run build

  browser-e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CULTURESHIFT_E2E_PYTHON: "python"
      CULTURESHIFT_CAPABILITY_SECRET: "day17-ci-fixture-secret-not-for-production"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -e .
      - run: npm --prefix apps/web ci
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e

  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/verify-public-boundary.ps1
